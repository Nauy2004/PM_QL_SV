name: bmi_app
description: "A BMI Health & Wellness Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  fl_chart: ^1.2.0
  flutter_local_notifications: ^21.0.0
  provider: ^6.0.5
  intl: ^0.20.2
  http: ^1.1.0
